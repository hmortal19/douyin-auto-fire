name: 每日定时运行 Python 脚本

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 自动触发
    - cron: '0 5 * * *'
  # 支持在 GitHub 网页上手动点击按钮立即运行
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖（如果有）
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 执行 Python 脚本
        run: scheduled_job.yml
